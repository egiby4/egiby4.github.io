<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b18"><title>VOID RUN — Space Runner</title>
<style>
:root{color-scheme:dark;--cyan:#7df9ff;--violet:#b49aff;--ink:#070b18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#182348,#070b18 62%);color:#eef5ff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}.shell{width:min(100%,1050px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.brand{font-weight:950;letter-spacing:-.06em;font-size:clamp(22px,4vw,34px)}.brand b{color:var(--cyan)}.tag{font:11px ui-monospace,monospace;letter-spacing:.18em;color:#a6b5d7}.stats{display:flex;gap:9px}.stat{border:1px solid #ffffff1b;background:#ffffff08;padding:9px 14px;border-radius:13px;min-width:90px}.stat small{display:block;color:#94a5c9;font-size:10px;letter-spacing:.12em}.stat strong{font-size:19px}.stage{position:relative;overflow:hidden;border:1px solid #91a9ff45;border-radius:22px;background:#070b18;box-shadow:0 28px 100px #0008}.stage canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:manipulation}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#05091672,#050916bd);padding:20px;text-align:center}.overlay.hidden{display:none}.panel{max-width:490px}.kicker{font:11px ui-monospace,monospace;color:var(--cyan);letter-spacing:.24em}.panel h1{font-size:clamp(35px,7vw,66px);line-height:.95;letter-spacing:-.075em;margin:15px 0}.panel h1 span{color:var(--cyan)}.panel p{color:#b4c1dc;font-size:14px;line-height:1.7}.primary{border:0;border-radius:999px;background:var(--cyan);color:#06111a;font-weight:900;padding:14px 24px;margin-top:12px;cursor:pointer;box-shadow:0 0 35px #7df9ff2a}.primary:hover{transform:translateY(-2px)}.help{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:15px 3px;color:#a4b2d1;font-size:12px}.keys{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.key{display:inline-grid;place-items:center;min-width:28px;padding:5px 8px;border:1px solid #ffffff2b;border-bottom-width:3px;border-radius:7px;color:#eef5ff;font:11px ui-monospace,monospace}.mobile{display:none;gap:8px;margin-top:5px}.mobile button{flex:1;border:1px solid #ffffff24;background:#111a31;color:white;border-radius:12px;padding:13px;font-weight:800}.mobile button:active{background:#263657}@media(max-width:620px){body{padding:10px}.stats .stat{min-width:65px;padding:7px 9px}.stats small{font-size:8px}.stats strong{font-size:16px}.tag{display:none}.help{font-size:11px}.mobile{display:flex}.stage canvas{aspect-ratio:4/5}.panel p{font-size:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main class="shell">
<header><div><div class="tag">INFINITE RUNNER / PROTOTYPE 01</div><div class="brand">VOID <b>RUN</b></div></div><div class="stats"><div class="stat"><small>DISTANCE</small><strong id="distance">0000</strong></div><div class="stat"><small>BEST</small><strong id="best">0000</strong></div><div class="stat"><small>SHARDS</small><strong id="shards">0</strong></div></div></header>
<div class="stage"><canvas id="game" width="960" height="540" aria-label="3D 우주 러너 게임"></canvas>
<div class="overlay" id="overlay"><div class="panel"><div class="kicker">RUN. DODGE. SURVIVE.</div><h1>FALL INTO<br><span>THE VOID.</span></h1><p>끝없이 이어지는 우주 통로를 달려 봐! 빈 타일을 피하고 빛나는 에너지 조각을 모아 최고 기록에 도전하세요.</p><button class="primary" id="start">RUN 시작하기 ↗</button><p>← → 이동 · ↑ / Space 점프 · 터치 버튼 지원</p></div></div>
</div><div class="help"><div class="keys"><span class="key">←</span><span class="key">→</span> 레인 이동 <span class="key">SPACE</span> 점프</div><span>빛나는 조각을 모으고 빈 공간을 피하세요.</span></div>
<div class="mobile"><button id="left">← 왼쪽</button><button id="jump">↑ 점프</button><button id="right">오른쪽 →</button></div>
</main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay');
const $=id=>document.getElementById(id);let running=false,dead=false,last=0,distance=0,shards=0,speed=15,playerLane=1,jump=0,vy=0,spawn=0,tiles=[],particles=[],time=0;
let best=0;try{best=Number(localStorage.getItem('void-run-best')||0)}catch(e){}$('best').textContent=String(best).padStart(4,'0');
const W=960,H=540,lanes=[-1,0,1];function reset(){distance=0;shards=0;speed=15;playerLane=1;jump=0;vy=0;spawn=0;time=0;tiles=[];particles=[];for(let z=0;z<30;z++)addTile(z*4+8);$('distance').textContent='0000';$('shards').textContent='0';dead=false}
function addTile(z){let hole=Math.random()<.19;let lane=Math.floor(Math.random()*3);let shard=!hole&&Math.random()<.46;tiles.push({z,hole,lane,shard,got:false})}
function project(x,y,z){let depth=1/(1+z*.115);return {x:W/2+x*depth*310,y:H*.46+(y-H*.46)*depth*.82,scale:depth}}
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function line(a,b,color,width=1){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function drawBackground(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101b3d');g.addColorStop(.5,'#090f24');g.addColorStop(1,'#050814');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let i=0;i<95;i++){let x=(i*137.7+Math.sin(i*9.1)*70)%W,y=(i*71.3+time*(8+i%4)*.25)%H;ctx.fillStyle='rgba(180,205,255,'+(.15+(i%5)*.09)+')';ctx.fillRect(x,y,1.5,1.5)}
// tunnel frame
for(let i=0;i<8;i++){let z=i*4+1-(time*speed*.22%4),a=project(-3.5,-100,z),b=project(3.5,-100,z),c=project(3.5,H+100,z),d=project(-3.5,H+100,z);poly([a,b,c,d],null,'rgba(125,249,255,'+(0.04+i*.008)+')')}
}
function drawTrack(){const near=project(0,H,0),far=project(0,H,35);const l1=project(-1.65,H,0),r1=project(1.65,H,0),l2=project(-1.65,H,35),r2=project(1.65,H,35);poly([l1,r1,r2,l2],'#101b36','#344a7d');
for(let k=-1;k<=2;k++){let x=-1.65+k*1.1;line(project(x,H,0),project(x,H,35),'rgba(125,249,255,.22)',2)}
for(let z=0;z<36;z+=3){let zz=(z+time*speed*.22)%36;let a=project(-1.65,H,zz),b=project(1.65,H,zz);line(a,b,'rgba(125,249,255,'+(0.08+(1-zz/36)*.25)+')',1+(1-zz/36)*2)}
// glowing rails
for(let x of [-1.8,1.8]){line(project(x,H,0),project(x,H,35),'#7df9ff55',3)}
}
function tileShape(t){let x=lanes[t.lane],z=t.z-(time*speed*.22);if(z<-.8||z>35)return;let a=project(x-.51,H,z),b=project(x+.51,H,z),c=project(x+.51,H,z+3.6),d=project(x-.51,H,z+3.6);if(t.hole){poly([a,b,c,d],'#030611','#2b3d70');let glow=project(x,H,z+1.8);ctx.beginPath();ctx.ellipse(glow.x,glow.y,32*glow.scale,7*glow.scale,0,0,Math.PI*2);ctx.fillStyle='#ff4fba';ctx.fill()}else{poly([a,b,c,d],t.got?'#18294a':'#20375f','#6589ce');poly([a,b,project(x+.51,H-5,z),project(x-.51,H-5,z)],'#7df9ff22','#7df9ff66');if(t.shard&&!t.got){let p=project(x,H-35,z+1.7),s=13*p.scale;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(time*2);poly([{x:0,y:-s},{x:s*.7,y:0},{x:0,y:s},{x:-s*.7,y:0}],'#7df9ff','#e1ffff');ctx.restore()}}}
function drawPlayer(){let x=lanes[playerLane],base=project(x,H-10,1.3),lift=jump*110;let s=base.scale;ctx.save();ctx.translate(base.x,base.y-lift);ctx.shadowColor='#7df9ff';ctx.shadowBlur=22*s;poly([{x:0,y:-48*s},{x:20*s,y:-20*s},{x:13*s,y:7*s},{x:-13*s,y:7*s},{x:-20*s,y:-20*s}],'#8cfaff','#eaffff');ctx.shadowBlur=0;poly([{x:0,y:-38*s},{x:9*s,y:-20*s},{x:0,y:-10*s},{x:-9*s,y:-20*s}],'#7c76ff');ctx.fillStyle='#d8ffff';ctx.fillRect(-3*s,0,6*s,12*s);ctx.restore();let p=project(x,H,1.4);ctx.beginPath();ctx.ellipse(p.x,p.y,24*s*(1-jump*.4),6*s*(1-jump*.4),0,0,Math.PI*2);ctx.fillStyle='#7df9ff33';ctx.fill()}
function burst(x,y,color){for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*170,vy:(Math.random()-.5)*170,life:.65,color})}
function drawParticles(dt){particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life/.65);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0)}
function endGame(){running=false;dead=true;best=Math.max(best,Math.floor(distance));try{localStorage.setItem('void-run-best',best)}catch(e){}$('best').textContent=String(best).padStart(4,'0');overlay.classList.remove('hidden');overlay.querySelector('.kicker').textContent='RUN COMPLETE';overlay.querySelector('h1').innerHTML='NICE TRY.<br><span>RUN AGAIN.</span>';overlay.querySelector('p').textContent='거리 '+Math.floor(distance)+' · 에너지 조각 '+shards+'개를 모았어요. 조금 더 멀리 달려볼까요?';$('start').textContent='다시 도전하기 ↻'}
function update(dt){time+=dt;if(!running)return;distance+=dt*speed*.8;speed=Math.min(27,15+distance*.008);$('distance').textContent=String(Math.floor(distance)).padStart(4,'0');spawn+=dt*speed*.22;if(spawn>3.6){spawn=0;addTile(34)}
tiles.forEach(t=>{t.z-=dt*speed*.22;if(t.z<1.9&&t.z>-.7){if(t.hole&&t.lane===playerLane&&jump<.42){endGame()}else if(t.shard&&!t.got&&t.lane===playerLane&&jump<.9){t.got=true;shards++;$('shards').textContent=shards;let p=project(lanes[t.lane],H-45,t.z+1);burst(p.x,p.y,'#7df9ff')}}});tiles=tiles.filter(t=>t.z>-.8);if(jump>0){jump+=vy*dt;vy-=2.9*dt;if(jump<=0){jump=0;vy=0}}}
function render(dt){drawBackground();drawTrack();tiles.slice().sort((a,b)=>b.z-a.z).forEach(tileShape);drawPlayer();drawParticles(dt);if(running){ctx.fillStyle='#7df9ff';ctx.font='12px ui-monospace,monospace';ctx.fillText('SECTOR 01  /  KEEP MOVING',24,32)}}
function loop(ts){let dt=Math.min(.035,(ts-last)/1000||0);last=ts;update(dt);render(dt);requestAnimationFrame(loop)}
function start(){reset();running=true;overlay.classList.add('hidden');last=performance.now()}
function move(dir){if(!running)return;playerLane=Math.max(0,Math.min(2,playerLane+dir))}
function doJump(){if(running&&jump===0){jump=.01;vy=2.5}}
$('start').addEventListener('click',start);$('left').addEventListener('click',()=>move(-1));$('right').addEventListener('click',()=>move(1));$('jump').addEventListener('click',doJump);
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','A','D','w','W'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')move(-1);if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')move(1);if(e.key==='ArrowUp'||e.key===' '||e.key==='w'||e.key==='W')doJump();if((e.key==='Enter'||e.key===' ')&&!running&&overlay.classList.contains('hidden')===false)start()});
let touchX=null;canvas.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX},{passive:true});canvas.addEventListener('touchend',e=>{if(touchX===null)return;let dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>25)move(dx<0?-1:1);else doJump();touchX=null},{passive:true});
reset();requestAnimationFrame(loop);
})();
</script></body></html>
