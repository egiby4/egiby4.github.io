<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff2dc"><title>꼬마펫 마을 — Pet Life</title>
<style>
:root{--ink:#433a51;--pink:#ff9fbd;--cream:#fff8ec;--mint:#a9e8cf;--purple:#b6a4f8;--gold:#ffcf69}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#fff2dc,#f9e7ff 55%,#e0f7f2);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.logo{font-size:clamp(24px,4vw,36px);font-weight:1000;letter-spacing:-.06em}.logo span{color:#ef7da1}.wallet{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#fff;border:2px solid #fff;border-radius:999px;padding:9px 14px;font-weight:850;box-shadow:0 5px 16px #6c587014}.layout{display:grid;grid-template-columns:1.4fr .8fr;gap:16px;margin-top:18px}.scene,.panel{background:#ffffffc9;border:2px solid #fff;border-radius:25px;padding:18px;box-shadow:0 14px 38px #7d668318}.scene{overflow:hidden}.scene-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.scene-head h2{margin:0;font-size:19px}.tiny{font-size:12px;color:#887e99}.world{position:relative;min-height:355px;border-radius:20px;overflow:hidden;background:linear-gradient(#bfe8ff 0 48%,#b9edce 48% 100%);border:2px solid #fff}.sun{position:absolute;right:9%;top:9%;width:58px;height:58px;border-radius:50%;background:#ffe28c;box-shadow:0 0 0 12px #ffe28c3d}.cloud{position:absolute;width:90px;height:28px;background:#fff9;border-radius:99px;top:19%;left:9%}.cloud:after,.cloud:before{content:"";position:absolute;background:inherit;border-radius:50%;width:37px;height:37px;top:-15px;left:17px}.cloud:after{left:42px;top:-8px;width:28px;height:28px}.hill{position:absolute;bottom:0;width:130%;height:130px;left:-15%;background:#87d7a9;border-radius:50% 50% 0 0}.hill.back{bottom:35px;left:-30%;height:115px;background:#9ce3b7;opacity:.8}.path{position:absolute;bottom:-35px;left:35%;width:35%;height:150px;background:#f5d7a9;transform:rotate(-12deg);border-radius:50%}.house{position:absolute;bottom:85px;left:9%;width:100px;height:82px;background:#fff1d7;border:4px solid #d78e91;border-radius:10px}.roof{position:absolute;top:-38px;left:-12px;width:116px;height:65px;background:#ef8f9c;clip-path:polygon(50% 0,100% 100%,0 100%)}.door{position:absolute;bottom:0;left:36px;width:25px;height:43px;border-radius:12px 12px 0 0;background:#b785a4}.window{position:absolute;top:17px;right:9px;width:22px;height:22px;border:3px solid #8dc9e6;background:#d8f5ff}.tree{position:absolute;bottom:85px;right:8%;width:20px;height:65px;background:#a76d52}.tree:before{content:"";position:absolute;left:-25px;top:-37px;width:70px;height:70px;border-radius:50%;background:#68c89a;box-shadow:17px 9px 0 #7ed9a4,-12px 15px 0 #55b88b}.pet{position:absolute;z-index:4;left:50%;bottom:48px;transform:translateX(-50%);font-size:clamp(68px,12vw,112px);filter:drop-shadow(0 10px 4px #4d6b3928);animation:bob 2s ease-in-out infinite;cursor:pointer;user-select:none}.pet-name{position:absolute;z-index:5;left:50%;bottom:31px;transform:translateX(-50%);background:#fff;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:900;white-space:nowrap}.sparkle{position:absolute;z-index:3;left:57%;bottom:140px;font-size:24px;animation:twinkle 1.5s infinite}@keyframes bob{50%{transform:translate(-50%,-9px) rotate(3deg)}}@keyframes twinkle{50%{opacity:.3;transform:scale(.8)}}.needs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}.need{background:#fff;border-radius:14px;padding:10px}.need label{display:flex;justify-content:space-between;font-size:11px;font-weight:800}.bar{height:7px;background:#eee8f3;border-radius:99px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;width:70%;background:var(--mint);border-radius:99px;transition:width .3s}.panel h2{font-size:19px;margin:0 0 5px}.panel p{font-size:12px;line-height:1.6;color:#82778e}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.action,.primary,.tab{border:0;border-radius:14px;padding:12px 10px;font-weight:850;color:var(--ink);background:#f4edff;transition:transform .15s,filter .15s}.action:hover,.primary:hover,.tab:hover{transform:translateY(-2px);filter:brightness(.98)}.action span{display:block;font-size:21px;margin-bottom:3px}.primary{background:var(--pink);width:100%;margin-top:10px}.shop{margin-top:15px;padding-top:15px;border-top:2px dashed #eee0f2}.shop-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-radius:13px;padding:10px;margin-top:8px}.shop-row b{font-size:13px}.shop-row small{display:block;color:#9387a0}.buy{border:0;background:#ffdc89;border-radius:10px;padding:8px 10px;font-weight:900;white-space:nowrap}.collection{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pet-chip{border:2px solid #f1e7fa;background:white;border-radius:13px;padding:8px 10px;cursor:pointer;font-weight:800}.pet-chip.active{border-color:#f38fb1;background:#fff0f5}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#433a51;color:white;padding:12px 18px;border-radius:999px;font-weight:750;font-size:13px;box-shadow:0 8px 30px #433a5133;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.foot{text-align:center;color:#8c8198;font-size:11px;padding:18px}@media(max-width:760px){.layout{grid-template-columns:1fr}.world{min-height:320px}.app{padding:12px}.scene,.panel{padding:13px}.needs{gap:6px}.need{padding:8px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="app">
<header class="top"><div><div class="tiny">A LITTLE WORLD FULL OF LOVE ✦</div><div class="logo">꼬마펫 <span>마을</span> 🐾</div></div><div class="wallet"><div class="pill">🪙 <b id="coins">150</b></div><div class="pill">🏡 나의 작은 집</div></div></header>
<div class="layout"><section class="scene"><div class="scene-head"><h2>🌷 햇살 공원</h2><span class="tiny">펫을 눌러 인사해 봐!</span></div><div class="world"><div class="sun"></div><div class="cloud"></div><div class="hill back"></div><div class="hill"></div><div class="path"></div><div class="house"><div class="roof"></div><div class="door"></div><div class="window"></div></div><div class="tree"></div><div class="sparkle">✦</div><div class="pet" id="bigPet" role="button" tabindex="0" aria-label="펫 쓰다듬기">🐶</div><div class="pet-name" id="petName">몽실이 · 보통</div></div><div class="needs"><div class="need"><label><span>🍖 배고픔</span><b id="foodNum">72%</b></label><div class="bar"><i id="foodBar"></i></div></div><div class="need"><label><span>🫧 청결</span><b id="cleanNum">78%</b></label><div class="bar"><i id="cleanBar"></i></div></div><div class="need"><label><span>💖 행복</span><b id="happyNum">85%</b></label><div class="bar"><i id="happyBar"></i></div></div></div></section>
<aside class="panel"><h2>💗 펫 돌보기</h2><p>작은 친구에게 필요한 걸 해 주세요. 돌봄 행동을 하면 코인도 조금씩 모을 수 있어요!</p><div class="actions"><button class="action" data-care="food"><span>🦴</span>간식 주기</button><button class="action" data-care="clean"><span>🛁</span>씻겨 주기</button><button class="action" data-care="happy"><span>🎾</span>같이 놀기</button><button class="action" data-care="love"><span>🫶</span>쓰다듬기</button></div><button class="primary" id="eggBtn">🥚 펫 알 입양하기 · 80 코인</button>
<div class="shop"><h2>🧺 작은 펫 가게</h2><div class="shop-row"><div><b>🍪 고급 간식</b><small>배고픔 +35</small></div><button class="buy" data-buy="snack">20 🪙</button></div><div class="shop-row"><div><b>🧸 반짝이 장난감</b><small>행복 +35</small></div><button class="buy" data-buy="toy">25 🪙</button></div><div class="shop-row"><div><b>🫧 거품 목욕제</b><small>청결 +35</small></div><button class="buy" data-buy="soap">20 🪙</button></div><div class="shop"><h2>🐾 나의 펫 컬렉션</h2><p>입양한 친구를 눌러 함께할 펫을 바꿔 보세요.</p><div class="collection" id="collection"></div></div></div></aside></div><div class="foot">꼬마펫 마을 · 오리지널 펫 돌봄 게임 · 진행 상황은 이 브라우저에 저장돼요.</div></main><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const petTypes=[{name:'몽실이',emoji:'🐶',rarity:'일반'},{name:'치즈',emoji:'🐱',rarity:'일반'},{name:'콩이',emoji:'🐰',rarity:'일반'},{name:'구름',emoji:'🐼',rarity:'희귀'},{name:'별이',emoji:'🦊',rarity:'희귀'},{name:'보리',emoji:'🐸',rarity:'특별'},{name:'루나',emoji:'🦄',rarity:'전설'}];let state={coins:150,food:72,clean:78,happy:85,pets:[0],active:0};try{const s=JSON.parse(localStorage.getItem('little-pet-village-v1')||'null');if(s&&Array.isArray(s.pets)&&s.pets.length)state={...state,...s}}catch(e){}let toastTimer;function save(){try{localStorage.setItem('little-pet-village-v1',JSON.stringify(state))}catch(e){}}function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}function activePet(){return petTypes[state.pets[state.active]]||petTypes[0]}function render(){const p=activePet();$('coins').textContent=state.coins;$('bigPet').textContent=p.emoji;$('petName').textContent=p.name+' · '+p.rarity;$('foodNum').textContent=state.food+'%';$('cleanNum').textContent=state.clean+'%';$('happyNum').textContent=state.happy+'%';$('foodBar').style.width=state.food+'%';$('cleanBar').style.width=state.clean+'%';$('happyBar').style.width=state.happy+'%';[['foodBar',state.food],['cleanBar',state.clean],['happyBar',state.happy]].forEach(([id,v])=>$(id).style.background=v<30?'#ff9fbd':'#a9e8cf');$('collection').innerHTML=state.pets.map((id,i)=>'<button class="pet-chip '+(i===state.active?'active':'')+'" data-pet="'+i+'">'+petTypes[id].emoji+' '+petTypes[id].name+'</button>').join('')}function cap(n){return Math.max(0,Math.min(100,n))}function care(type){if(type==='food'){state.food=cap(state.food+24);toast('냠냠! 맛있게 먹었어요 🍖')}if(type==='clean'){state.clean=cap(state.clean+28);toast('뽀송뽀송 깨끗해졌어요 🫧')}if(type==='happy'){state.happy=cap(state.happy+22);toast('신나게 놀았어요! 🎾')}if(type==='love'){state.happy=cap(state.happy+12);toast('기분 좋은 쓰다듬기 💗')}state.coins+=5;save();render()}document.querySelectorAll('[data-care]').forEach(b=>b.addEventListener('click',()=>care(b.dataset.care)));$('bigPet').addEventListener('click',()=>care('love'));$('bigPet').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();care('love')}});$('eggBtn').addEventListener('click',()=>{if(state.coins<80){toast('코인이 부족해요. 펫을 돌보며 모아 보세요!');return}state.coins-=80;const weights=[0,0,0,1,1,2,3];const pick=Math.random()<.03?6:Math.random()<.15?5:Math.random()<.32?3+Math.floor(Math.random()*2):Math.floor(Math.random()*3);const id=weights[pick]===undefined?pick:pick;if(state.pets.includes(id)){state.coins+=35;toast('중복 펫이에요! 대신 35 코인을 받았어요 🪙')}else{state.pets.push(id);state.active=state.pets.length-1;toast(petTypes[id].rarity+' '+petTypes[id].name+' 입양 성공! 🎉')}save();render()});document.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>{const item=b.dataset.buy,cost=item==='toy'?25:20;if(state.coins<cost){toast('코인이 부족해요!');return}state.coins-=cost;if(item==='snack')state.food=cap(state.food+35);if(item==='toy')state.happy=cap(state.happy+35);if(item==='soap')state.clean=cap(state.clean+35);toast('아이템을 사용했어요! ✨');save();render()}));$('collection').addEventListener('click',e=>{const b=e.target.closest('[data-pet]');if(!b)return;state.active=Number(b.dataset.pet);save();render();toast(activePet().name+'와 함께해요!')});setInterval(()=>{state.food=cap(state.food-1);state.clean=cap(state.clean-1);state.happy=cap(state.happy-1);save();render()},25000);render()})();
</script></body></html>
